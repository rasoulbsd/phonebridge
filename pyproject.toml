[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "phonebridge"
dynamic = ["version"]
description = "Read and send iPhone texts from a Windows PC over Bluetooth."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web API + WebSocket endpoints the UI talks to (phonebridge.web.app).
    "fastapi>=0.115",
    # ASGI server that runs the web app; [standard] adds WebSocket support (phonebridge.__main__).
    "uvicorn[standard]>=0.30",
    # Typed models for domain objects, phone payloads and API responses (phonebridge.domain, .protocol).
    "pydantic>=2.9",
    # Typed settings from environment variables / .env (phonebridge.settings).
    "pydantic-settings>=2.6",
    # Async SQLite for the saved message history and contacts (phonebridge.storage.sqlite).
    "aiosqlite>=0.20",
    # REST client for BlueBubbles Server on the Mac (phonebridge.mac.client).
    "httpx>=0.27",
    # Live events from BlueBubbles Server over Socket.IO (phonebridge.mac.events).
    "python-socketio[asyncio_client]>=5.11",
    # Multipart parsing for attachment uploads (phonebridge.web.app send_attachment).
    "python-multipart>=0.0.9",
    # WinRT bindings: Bluetooth RFCOMM, device lookup and sockets (phonebridge.bluetooth). Windows only.
    "winrt-runtime>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Devices.Bluetooth>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Devices.Bluetooth.Rfcomm>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Devices.Enumeration>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Networking>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Networking.Sockets>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.0; sys_platform == 'win32'",
    # Native Windows notifications from the desktop app (phonebridge.shell.toasts). Windows only.
    "winrt-Windows.UI.Notifications>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Data.Xml.Dom>=3.0; sys_platform == 'win32'",
    # Desktop app window via the Edge WebView2 runtime (phonebridge.shell.app).
    "pywebview>=5.0",
    # Tray icon with Open / Start with Windows / Quit (phonebridge.shell.tray).
    "pystray>=0.19",
    # Loads the tray icon image for pystray (phonebridge.shell.app, packaging/make_icon.py) and
    # shrinks the full-size contact photos the Mac sends (phonebridge.mac.photos).
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    # Test runner and asyncio support (tests/).
    "pytest>=8",
    "pytest-asyncio>=0.24",
    # Linter/formatter and type checker used by the dev loop.
    "ruff>=0.8",
    "ty>=0.0.1a1",
    # Builds the Windows app and its setup .exe (packaging/build.py).
    "pyinstaller>=6.0",
]

[project.scripts]
phonebridge = "phonebridge.__main__:main"

[project.gui-scripts]
phonebridge-desktop = "phonebridge.shell.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "phonebridge.__version__" }

[tool.setuptools.package-data]
phonebridge = ["web/static/*", "assets/*"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RET", "RUF",
    "ASYNC", "ANN", "S", "DTZ", "PT", "TC",
]
ignore = [
    # The formatter owns line length.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# pytest uses plain asserts; fixtures use obviously fake tokens; Persian sample
# text in tests is intentional, so "ambiguous" Arabic-script letters are expected;
# tests parse XML that the code under test just produced.
"tests/**" = ["S101", "S105", "S106", "S314", "RUF001"]
# MAP listings and event reports come only from the paired phone, and the
# bundled expat (>= 2.4) already caps entity expansion; ElementTree never
# resolves external entities. defusedxml would add a dependency for no gain.
"src/phonebridge/protocol/map.py" = ["S314"]
# Install/uninstall and the build script run fixed Windows tools (taskkill, PowerShell,
# cmd) and PyInstaller with paths computed in code; nothing user-supplied reaches them.
"src/phonebridge/shell/install.py" = ["S603"]
"packaging/*.py" = ["S603"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves field annotations at runtime, so their imports must stay real.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "phonebridge.domain.models._Frozen",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ty.src]
include = ["src", "tests"]
